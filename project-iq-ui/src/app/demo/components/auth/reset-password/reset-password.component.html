<div class="surface-ground flex align-items-center justify-content-center min-h-screen min-w-screen overflow-hidden">
    <div class="flex flex-column align-items-center justify-content-center">
        
        <div style="border-radius:56px; padding:0.3rem; background: linear-gradient(180deg, var(--primary-color) 10%, rgba(33, 150, 243, 0) 30%); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);">
            <div class="w-full surface-card py-8 px-5 sm:px-8" style="border-radius:53px">
                
                <div class="text-center mb-5">
                    <div class="mb-3">
                        <i class="pi pi-shield text-primary" style="font-size: 3rem"></i>
                    </div>
                    <div class="text-900 text-3xl font-medium mb-3">Sécurité du Compte</div>
                    <span class="text-600 font-medium">Réinitialisation sécurisée de votre mot de passe</span>
                </div>

                <div *ngIf="!isSuccess; else successTpl" class="mt-4">
                    <div class="flex flex-column gap-4">
                        <div>
                            <label for="pass" class="block text-900 text-lg font-medium mb-2">Nouveau mot de passe</label>
                            <p-password id="pass" [(ngModel)]="newPassword" [toggleMask]="true" 
                                placeholder="Entrez 6 caractères min."
                                styleClass="w-full" inputStyleClass="w-full p-3 md:w-30rem"
                                [feedback]="true" promptLabel="Choisissez un mot de passe"
                                weakLabel="Faible" mediumLabel="Moyen" strongLabel="Fort"></p-password>
                        </div>

                        <div>
                            <label for="confirm" class="block text-900 text-lg font-medium mb-2">Confirmer le nouveau mot de passe</label>
                            <p-password id="confirm" [(ngModel)]="confirmPassword" [toggleMask]="true" [feedback]="false"
                                placeholder="Confirmez votre mot de passe"
                                styleClass="w-full" inputStyleClass="w-full p-3 md:w-30rem"></p-password>
                        </div>

                        <button pButton pRipple label="Mettre à jour le mot de passe" 
                            icon="pi pi-lock-open"
                            class="w-full p-3 text-xl mt-2 p-button-raised"
                            [loading]="isLoading" (click)="onReset()"></button>
                    </div>
                </div>

                <ng-template #successTpl>
                    <div class="text-center py-4" style="min-width: 30rem">
                        <div class="mb-4">
                            <i class="pi pi-check-circle text-green-500" style="font-size: 6rem; animation: pulse 2s infinite"></i>
                        </div>
                        <h2 class="text-900 font-bold mb-3">Mot de passe mis à jour !</h2>
                        <p class="text-700 line-height-3 text-xl mb-5">
                            Votre compte est maintenant sécurisé.<br>
                            Redirection automatique vers la connexion...
                        </p>
                        <p-progressBar mode="indeterminate" [style]="{'height': '6px'}"></p-progressBar>
                    </div>
                </ng-template>

            </div>
        </div>
        
        <div class="text-600 mt-5 font-medium">
            ProjectIQ © 2024 - Système d'Audit Sécurisé
        </div>
    </div>
</div>

<style>
@keyframes pulse {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.1); opacity: 0.8; }
    100% { transform: scale(1); opacity: 1; }
}
</style>

<p-toast></p-toast>
