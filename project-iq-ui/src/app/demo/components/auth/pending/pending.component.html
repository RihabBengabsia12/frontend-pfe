<div class="surface-ground flex align-items-center justify-content-center min-h-screen min-w-screen overflow-hidden">
    <div class="flex flex-column align-items-center justify-content-center">
        <div style="border-radius: 56px; padding: 0.3rem; background: linear-gradient(180deg, rgba(245, 158, 11, 0.4) 10%, rgba(245, 158, 11, 0) 30%);">
            <div class="w-full surface-card py-8 px-5 sm:px-8 flex flex-column align-items-center" style="border-radius: 53px">
                <div class="flex justify-content-center align-items-center bg-orange-500 border-circle" style="height: 5rem; width: 5rem;">
                    <i class="pi pi-clock text-5xl text-white"></i>
                </div>
                <h1 class="text-900 font-bold text-5xl mb-2 text-center">Compte en attente</h1>
                <div class="text-600 mb-5 text-center line-height-3 max-w-20rem">
                    Votre inscription a bien été enregistrée ! L'administrateur système doit valider votre accès avant que vous puissiez utiliser ProjectIQ.
                </div>
                
                <div class="flex flex-column gap-3 w-full">
                    <button pButton pRipple icon="pi pi-refresh" class="p-button-outlined p-button-warning w-full" label="Vérifier le statut" onclick="window.location.reload()"></button>
                    <button pButton pRipple icon="pi pi-sign-out" class="p-button-text w-full text-500" label="Déconnexion" (click)="logout()"></button>
                </div>
            </div>
        </div>
    </div>
</div>
