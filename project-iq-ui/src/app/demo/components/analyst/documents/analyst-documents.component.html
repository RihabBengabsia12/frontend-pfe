<div class="grid p-4 fade-in-up">
    <!-- Header -->
    <div class="col-12 mb-3">
        <div class="card card-pastel-blue p-4 border-round-3xl shadow-2">
            <div class="flex align-items-center gap-3">
                <div class="w-3rem h-3rem bg-white-alpha-60 border-circle flex align-items-center justify-content-center">
                    <i class="pi pi-folder text-2xl text-blue-700"></i>
                </div>
                <div>
                    <h1 class="text-midnight font-bold text-3xl m-0">Documents & Dossiers</h1>
                    <p class="text-blue-800 m-0 opacity-80">Consultez et téléchargez tous les documents importés dans la plateforme.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Liste documents -->
    <div class="col-12">
        <div class="card border-round-2xl shadow-2 p-5">
            <div class="flex flex-column md:flex-row md:align-items-center justify-content-between mb-4 gap-3">
                <div>
                    <h5 class="text-900 font-bold text-xl m-0 flex align-items-center gap-2">
                        <i class="pi pi-file text-blue-600"></i>
                        Dossiers importés
                    </h5>
                    <p class="text-500 text-sm m-0 mt-1">{{ filtered.length }} document(s)</p>
                </div>
                <div class="flex align-items-center gap-2">
                    <span class="p-input-icon-left w-full md:w-auto">
                        <i class="pi pi-search"></i>
                        <input pInputText type="text"
                               [(ngModel)]="searchTerm"
                               placeholder="Rechercher un document…"
                               class="w-full md:w-20rem border-round-3xl" />
                    </span>
                    <button pButton icon="pi pi-refresh" class="p-button-rounded p-button-outlined"
                            pTooltip="Actualiser" (click)="loadProjects()"></button>
                </div>
            </div>

            <p-table [value]="filtered" [loading]="isLoading" responsiveLayout="scroll"
                     [paginator]="filtered.length > 8" [rows]="8"
                     styleClass="p-datatable-gridlines p-datatable-striped shadow-1 border-round-xl overflow-hidden">
                <ng-template pTemplate="header">
                    <tr>
                        <th>Titre</th>
                        <th>Fichier</th>
                        <th>Description</th>
                        <th>Statut</th>
                        <th class="text-center">Actions</th>
                    </tr>
                </ng-template>

                <ng-template pTemplate="body" let-project>
                    <tr>
                        <td class="font-bold text-900">{{ project.title }}</td>
                        <td>
                            <div class="flex align-items-center gap-2">
                                <i class="pi pi-file-pdf text-blue-600"></i>
                                <span class="text-700">{{ project.fileName || '—' }}</span>
                            </div>
                        </td>
                        <td class="text-600">{{ project.description || '—' }}</td>
                        <td>
                            <p-tag [value]="statusLabel(project.status)"
                                   [severity]="statusSeverity(project.status)"
                                   styleClass="status-tag-premium"></p-tag>
                        </td>
                        <td class="text-center">
                            <button pButton icon="pi pi-download" label="Télécharger"
                                    class="p-button-outlined p-button-sm border-round-3xl"
                                    (click)="download(project)"></button>
                        </td>
                    </tr>
                </ng-template>

                <ng-template pTemplate="emptymessage">
                    <tr>
                        <td colspan="5" class="text-center py-5">
                            <i class="pi pi-inbox" style="font-size:2.5rem; color:#94a3b8;"></i>
                            <p class="text-500 mt-2 m-0">Aucun document trouvé.</p>
                        </td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </div>
</div>

<p-toast></p-toast>
